<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escala de Visita</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --blue-1: #3f68ad;
      --blue-2: #2f5798;
      --yellow: #ffd56b;
      --bg: #efefef;
      --green-1: #35984f;
      --green-2: #49b560;
      --green-3: #2f8d47;
      --yellow-1: #f2c84f;
      --yellow-2: #f4de8b;
      --yellow-3: #ecbf3c;
      --red-1: #e24646;
      --red-2: #f15e5e;
      --red-3: #d83a3a;
      --text: #21334d;
      --shadow: 0 6px 18px rgba(0,0,0,.12);
      --radius: 18px;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      background: linear-gradient(180deg, var(--blue-1), var(--blue-2));
      text-align: center;
      color: white;
      box-shadow: var(--shadow);
    }

    .header h1 {
      margin: 0;
      padding: 24px 16px 18px;
      font-size: clamp(42px, 6vw, 78px);
      line-height: 1.05;
      color: var(--yellow);
      font-weight: 900;
    }

    .rules {
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.45;
      font-weight: 700;
      padding: 16px 18px 18px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .container {
      max-width: 1320px;
      margin: 28px auto 48px;
      padding: 0 22px;
    }

    .section-title {
      text-align: center;
      font-size: clamp(34px, 4vw, 58px);
      margin: 10px 0 18px;
      color: #234d8f;
      font-weight: 900;
    }

    .next-card {
      width: min(100%, 640px);
      margin: 0 auto 36px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .next-card .part-1,
    .next-card .part-2,
    .next-card .part-3 {
      text-align: center;
      color: white;
      font-weight: 900;
    }

    .next-card .part-1 {
      background: var(--green-1);
      font-size: clamp(30px, 4vw, 64px);
      padding: 24px 12px 16px;
    }

    .next-card .part-2 {
      background: var(--green-2);
      font-size: clamp(34px, 4.4vw, 72px);
      padding: 18px 12px;
    }

    .next-card .part-3 {
      background: var(--green-3);
      font-size: clamp(22px, 2.8vw, 42px);
      padding: 14px 12px 16px;
    }

    .divider {
      height: 2px;
      background: #d2d8e3;
      margin: 18px auto 28px;
      max-width: 1240px;
    }

    .cards-title {
      text-align: center;
      font-size: clamp(28px, 3.2vw, 50px);
      color: #464646;
      font-weight: 900;
      margin: 0 0 24px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
      margin-bottom: 34px;
    }

    .weekend-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .weekend-card .line-1,
    .weekend-card .line-2,
    .weekend-card .line-3 {
      font-weight: 900;
      text-align: center;
    }

    .weekend-card .line-1 {
      font-size: clamp(24px, 2.2vw, 42px);
      padding: 16px 12px 14px;
    }

    .weekend-card .line-2 {
      font-size: clamp(26px, 2.6vw, 50px);
      padding: 14px 12px;
      min-height: 98px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
    }

    .weekend-card .line-3 {
      font-size: clamp(18px, 1.8vw, 34px);
      padding: 12px 12px 14px;
    }

    .card-green .line-1 { background: var(--green-1); color: white; }
    .card-green .line-2 { background: var(--green-2); color: white; }
    .card-green .line-3 { background: var(--green-3); color: white; }

    .card-yellow .line-1 { background: var(--yellow-1); color: #2b2b2b; }
    .card-yellow .line-2 { background: var(--yellow-2); color: #2b2b2b; }
    .card-yellow .line-3 { background: var(--yellow-3); color: #2b2b2b; }

    .card-red .line-1 { background: var(--red-1); color: white; }
    .card-red .line-2 { background: var(--red-2); color: white; }
    .card-red .line-3 { background: var(--red-3); color: white; }

    .toggle-wrap {
      display: flex;
      justify-content: center;
      margin: 4px 0 28px;
    }

    .toggle-button {
      border: none;
      background: white;
      color: #234d8f;
      font-weight: 900;
      font-size: clamp(20px, 2vw, 30px);
      padding: 14px 24px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      margin: 14px 0 36px;
    }

    .wa-button {
      background: linear-gradient(180deg, #40b65b, #2f9b48);
      color: white;
      text-decoration: none;
      font-weight: 900;
      font-size: clamp(24px, 2.2vw, 38px);
      padding: 20px 34px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }

    .wa-icon {
      width: 54px;
      height: 54px;
      border: 4px solid white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      line-height: 1;
      font-weight: 900;
    }

    .note {
      text-align: center;
      color: #5f6775;
      font-size: 18px;
      font-weight: 700;
      margin-top: -8px;
    }

    @media (max-width: 768px) {
      .container { padding: 0 14px; }
      .rules { padding: 14px; }
      .wa-button { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Escala da Lucimar</h1>
    <div class="rules">
      Sempre vale o nome que estiver nesta página 
    </div>
  </header>

  <main class="container">
    <h2 class="section-title">Próximo fim de semana:</h2>

    <section class="next-card">
      <div class="part-1" id="next-date">Carregando...</div>
      <div class="part-2" id="next-name">Carregando...</div>
      <div class="part-3" id="next-status">Carregando...</div>
    </section>

    <div class="divider"></div>

    <h3 class="cards-title">Próximos Finais de Semana:</h3>
    <section class="cards-grid" id="cards-grid"></section>

    <div class="toggle-wrap">
      <button class="toggle-button" id="toggle-cards">▼ Ver mais finais de semana</button>
    </div>

    <div class="button-wrap">
      <a class="wa-button" id="wa-link" href="#" target="_blank" rel="noopener noreferrer">
        <span class="wa-icon">✆</span>
        <span>PEDIR TROCA NO WHATSAPP</span>
      </a>
    </div>


  </main>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnOL1kJ-rfcGzWMZmbYKRbloHyf1E0ream8uer0JHxO_wozadJ1oWVz952dsAAzD1N/exec';

    const colorClassMap = {
      green: 'card-green',
      yellow: 'card-yellow',
      red: 'card-red'
    };

    const cardsGrid = document.getElementById('cards-grid');
    const toggleButton = document.getElementById('toggle-cards');
    const waLink = document.getElementById('wa-link');
    const nextDate = document.getElementById('next-date');
    const nextName = document.getElementById('next-name');
    const nextStatus = document.getElementById('next-status');

    let weekends = [];
    let showingAllCards = false;
    let initialVisibleCards = 3;

    function normalizeDate(dateString) {
      if (!dateString) return null;
      const date = new Date(dateString + 'T00:00:00');
      return isNaN(date.getTime()) ? null : date;
    }

    function todayAtMidnight() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function updateWhatsApp(adminNumber, defaultMessage) {
      const clean = String(adminNumber || '').replace(/\D/g, '');
      const msg = encodeURIComponent(defaultMessage || 'Olá, preciso solicitar uma troca na escala da Lucimar.');

      if (clean) {
        waLink.href = 'https://wa.me/' + clean + '?text=' + msg;
        waLink.style.opacity = '1';
        waLink.style.pointerEvents = 'auto';
      } else {
        waLink.href = '#';
        waLink.style.opacity = '.6';
        waLink.style.pointerEvents = 'none';
      }
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderCards(list) {
      cardsGrid.innerHTML = '';

      list.forEach(function(item) {
        const article = document.createElement('article');
        article.className = 'weekend-card ' + (colorClassMap[item.color] || 'card-green');
        article.innerHTML =
          '<div class="line-1">' + escapeHtml(item.date) + '</div>' +
          '<div class="line-2">' + escapeHtml(item.person) + '</div>' +
          '<div class="line-3">' + escapeHtml(item.status) + '</div>';
        cardsGrid.appendChild(article);
      });
    }

    function renderPage() {
      if (!weekends.length) {
        nextDate.textContent = 'SEM ESCALA';
        nextName.textContent = 'NENHUM FIM DE SEMANA DISPONÍVEL';
        nextStatus.textContent = 'VERIFICAR PLANILHA';
        cardsGrid.innerHTML = '';
        toggleButton.style.display = 'none';
        return;
      }

      const next = weekends[0];
      nextDate.textContent = next.date || '';
      nextName.textContent = next.person || '';
      nextStatus.textContent = next.status || '';

      const remaining = weekends.slice(1);
      const visible = showingAllCards
        ? remaining
        : remaining.slice(0, initialVisibleCards);

      renderCards(visible);

      if (!remaining.length || remaining.length <= initialVisibleCards) {
        toggleButton.style.display = 'none';
      } else {
        toggleButton.style.display = 'inline-flex';
        toggleButton.textContent = showingAllCards
          ? '▲ Mostrar só os próximos 3'
          : '▼ Ver mais finais de semana';
      }
    }

    function renderEscalaFromSheet(data) {
      updateWhatsApp(
        data && data.adminNumber ? data.adminNumber : '',
        data && data.defaultMessage ? data.defaultMessage : 'Olá, preciso solicitar uma troca na escala da Lucimar.'
      );

      initialVisibleCards = Number(data && data.initialCards ? data.initialCards : 3) || 3;

      const today = todayAtMidnight();
      const list = Array.isArray(data && data.weekends) ? data.weekends : [];

      weekends = list
        .filter(function(item) {
          if (!item || !item.date || !item.person) return false;
          const endDate = normalizeDate(item.endDate || item.startDate);
          if (!endDate) return true;
          return endDate >= today;
        })
        .sort(function(a, b) {
          const dateA = normalizeDate(a.startDate || a.endDate || '');
          const dateB = normalizeDate(b.startDate || b.endDate || '');
          if (!dateA && !dateB) return 0;
          if (!dateA) return 1;
          if (!dateB) return -1;
          return dateA - dateB;
        });

      renderPage();
    }

    function loadEscala() {
      const script = document.createElement('script');
      const sep = APPS_SCRIPT_URL.indexOf('?') >= 0 ? '&' : '?';
      script.src = APPS_SCRIPT_URL + sep + 'prefix=renderEscalaFromSheet&t=' + new Date().getTime();
      document.body.appendChild(script);
    }

    toggleButton.addEventListener('click', function() {
      showingAllCards = !showingAllCards;
      renderPage();
    });

    loadEscala();
  </script>
</body>
</html>
